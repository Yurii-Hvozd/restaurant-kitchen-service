{% extends "base.html" %}
{% block content %}
  <h1>Delete Cook</h1>

  <p>Are you sure you want to delete the cook: {{ cook.username }}?</p>
  <p><i>All dishes assigned to this cook will not be deleted, but this profile will be permanently removed!</i></p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger" />
  </form>
{% endblock %}
