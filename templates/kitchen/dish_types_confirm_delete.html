{% extends "base.html" %}
{% block content %}
  <h1>Delete Dish Type</h1>

  <p>Are you sure you want to delete the Dish Type: {{ dishtype.name }}?</p>
  <p><i>Dishes assigned to this type will lose their category, but the dishes themselves will not be deleted.</i></p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger"/>
  </form>
  <p>
    <a href="{% url 'kitchen:dish_types_list' %}">Back to dish type list</a>
  </p>
{% endblock %}
