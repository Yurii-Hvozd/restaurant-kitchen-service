{% extends "base.html" %}
{% block content %}
  <h1>Delete Ingredient</h1>

  <p>Are you sure you want to delete the ingredient: {{ ingredient.name }}?</p>
  <p><i>This ingredient will be permanently removed!</i></p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger"/>
  </form>
  <p>
    <a href="{% url 'kitchen:ingredient_list' %}">Back to ingredients list</a>
  </p>
{% endblock %}
