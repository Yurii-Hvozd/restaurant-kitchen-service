{% extends "base.html" %}
{% block content %}
  <div class="confirm-card">
    <span class="eyebrow">Confirmation</span>
    <h1>Delete ingredient</h1>
    <p class="confirm-question">Are you sure you want to delete the ingredient: {{ ingredient.name }}?</p>
    <p class="muted">This ingredient will be permanently removed!</p>
    <form action="" method="post" class="form-actions">
      {% csrf_token %}
      <a href="{% url 'kitchen:ingredient_list' %}" class="button button--light">Back to ingredients</a>
      <button type="submit" class="button button--danger">Yes, delete</button>
    </form>
  </div>
{% endblock %}
