{% extends "base.html" %}

{% block content %}
  <h1>
    Ingredient list
  </h1>
  {% if ingredient_list %}
    <ul>
      {% for ingredient in ingredient_list %}
        <li>
          {{ ingredient.name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars in taxi</p>
  {% endif %}
{% endblock %}
