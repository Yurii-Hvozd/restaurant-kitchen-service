{% extends "base.html" %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} dish</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <input type="submit" value="Submit">
  </form>
  {% if object.id %}
    <a href="{% url 'kitchen:dish_detail' pk=object.id %}">Back to {{ object.name }}</a>
  {% else %}
    <a href="{% url 'kitchen:dish_list' %}">Back to list</a>
  {% endif %}
{% endblock %}
