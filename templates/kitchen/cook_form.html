{% extends "base.html" %}
{% block content %}
  <header class="page-header">
    <div><span class="eyebrow">Team</span>
      <h1>{{ object|yesno:"Update,Create" }} cook</h1></div>
  </header>
  <section class="form-card">
    <form action="" method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <a href="{% url 'kitchen:cook_list' %}" class="button button--light">Cancel</a>
        <button type="submit" class="button button--dark">Save cook</button>
      </div>
    </form>
  </section>
{% endblock %}
