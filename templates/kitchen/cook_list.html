{% extends "base.html" %}

{% block content %}
  <h1>
    Cook list <a href="{% url 'kitchen:cook_create' %}">+</a>
  </h1>
  {% if cook_list %}
    <ul>
      {% for cook in cook_list %}
        <li>
          <a href="{% url "kitchen:cook_detail" pk=cook.id %}">{{ cook.first_name }} {{ cook.last_name }} ({{ cook.username }})</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No cooks found on the kitchen.</p>
  {% endif %}
{% endblock %}
